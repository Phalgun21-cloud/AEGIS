services:
  db:
    image: mysql:8.0
    container_name: aegis-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aegis
      MYSQL_USER: aegis
      MYSQL_PASSWORD: aegis
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - aegis_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aegis_mysql:
